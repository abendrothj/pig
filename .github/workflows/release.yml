name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI (release)
        run: cargo build --release --bin pig --target ${{ matrix.target }} --locked

      - name: Package artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="pig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${STAGING}/bin"
          cp "target/${{ matrix.target }}/release/pig" "${STAGING}/bin/"
          cp README.md pig.toml.example "${STAGING}/"
          tar czf "pig-${VERSION}-${{ matrix.target }}.tar.gz" "${STAGING}"

      - name: Upload release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: pig-*-${{ matrix.target }}.*
